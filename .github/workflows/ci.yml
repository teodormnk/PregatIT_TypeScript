name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only keep the latest run per branch/PR alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  greenit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node src/homepage/build.ts
      - run: node src/homepage/serve.ts &
      - run: timeout 30 sh -c 'until curl -sf http://localhost:8080 > /dev/null; do sleep 1; done'

      - uses: ythirion/greenit-analysis-action@v0.1.2
        with:
          url-file: greenit-urls.yaml
          min-ecoindex: '75'
          timezone: Europe/Bucharest
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint .